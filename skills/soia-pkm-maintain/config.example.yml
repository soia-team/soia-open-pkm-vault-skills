# soia-pkm-maintain private config example.
# Copy to ~/.config/soia-skills/soia-pkm-maintain/config.yml.

env:
  OBSIDIAN_VAULT: "<vault-path>"
  SOIA_SESSION_LOG_DIR: "30_日志与思考/20_Agent工作日志"
  # lint_vault.py: base values replace built-ins; *_ADD appends to the selected base.
  SOIA_LINT_TAGS: "<comma-separated-primary-tags>"
  SOIA_LINT_TAGS_ADD: "<additional-primary-tag>"
  SOIA_LINT_EXCLUDE: "<comma-separated-vault-relative-paths>"
  SOIA_LINT_EXCLUDE_ADD: "<vault-relative-path-to-skip>"
