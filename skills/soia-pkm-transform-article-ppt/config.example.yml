schema_version: 1

defaults:
  provider: auto              # auto | local_editable | notebooklm | hybrid | open_design
  content_mode: learning      # learning | preserve | synthesize
  style: auto
  slide_count: auto
  image_count: 3
  infographic: false
  purpose: auto
  delivery_context: auto
  language: auto
  review_mode: standard      # standard | thorough
  final_host: auto           # auto | microsoft_powerpoint | apple_keynote | libreoffice
  qa_mode: strict             # strict | normal
  output_root: outputs/transform

env:
  NOTEBOOKLM_HOME: "~/.config/soia-skills/soia-pkm-transform-article-ppt/notebooklm"
  NOTEBOOKLM_HL: "zh_Hans"
  OPEN_DESIGN_HOME: "<optional-open-design-home>"
